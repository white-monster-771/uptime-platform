apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuma
  namespace: uptime
  labels:
    app: kuma
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kuma
  template:
    metadata:
      labels:
        app: kuma
    spec:
      containers:
      - name: kuma
        image: louislam/uptime-kuma:1
        ports:
        - containerPort: 3001
        env:
        - name: TZ
          value: "Europe/Moscow"
        volumeMounts:
        - name: data-volume
          mountPath: /app/data
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: kuma-data-pvc
