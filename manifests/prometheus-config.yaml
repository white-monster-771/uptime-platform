apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: "traefik"
        metrics_path: /metrics
        static_configs:
          - targets: ["traefik-metrics.traefik.svc.cluster.local:9100"]
      - job_name: "prometheus"
        metrics_path: /prometheus/metrics
        static_configs:
          - targets: ["localhost:9090"]
